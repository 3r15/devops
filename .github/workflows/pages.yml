name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify generated pages match data/curriculum.json
        run: python3 tools/scaffold.py --check

      - name: Check internal links
        run: python3 tools/check_links.py

      - name: Check page structure
        run: python3 tools/check_structure.py

      - uses: actions/configure-pages@v5
        with:
          # 저장소에서 Pages가 아직 켜져 있지 않으면 워크플로가 직접 켠다.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
